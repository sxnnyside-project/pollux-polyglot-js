name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2
        with:
          bun-version: 1.4.0

      - name: Setup Deno
        uses: denoland/setup-deno@041b854f97b325bd60e83716c7cf2360aba1cb03 # v2
        with:
          deno-version: v2.x

      - name: Setup Node.js
        uses: actions/setup-node@49952e3fed74ff76b252541a547700a944fc3ec9 # v4.2.0
        with:
          node-version: 22

      - name: Install Rust toolchain (for native FFI bridge build)
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.93.0

      - name: Install just
        uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: just@1.58.0

      - name: Checkout and compile pollux-polyglot-native-bridge
        run: |
          cargo install pollux-polyglot-native-bridge --root /tmp/pollux-native || true
          # Alternatively build in place if cloned or available
        continue-on-error: true

      - name: Install dependencies
        run: just install

      - name: Run Quality Gate (format, lint, typecheck)
        run: |
          bun x biome check .
          bun x tsc --noEmit

      - name: Run Test Suite
        run: just test
        continue-on-error: true
